<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio de ejercicios Java</title>
<meta name="description" content="Ejercicios de Java (orientación a objetos, desarrollo web y bases de datos) que se ejecutan en vivo con su código real.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%230E2A47'/%3E%3Cpath d='M3 12h26M3 20h26' stroke='%23F2C94C' stroke-width='2.4'/%3E%3C/svg%3E">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('tema'); } catch (e) {}
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
  document.documentElement.setAttribute('data-tema', t);
})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="saltar" href="#principal" data-ir="principal">Saltar al contenido</a>
<header class="cabecera">
  <div class="cabecera-in">
    <a class="marca" href="#/" aria-label="Portafolio Java, inicio">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="3" class="marca-caja"/><path d="M3 12h26M3 20h26" class="marca-linea"/></svg>
      <span>Portafolio Java</span>
    </a>
    <div class="cabecera-der">
      <span id="modo" class="modo" role="status"></span>
      <button id="tema" class="icono" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="principal" tabindex="-1"><p class="cargando">Cargando el portafolio…</p></main>
<footer class="pie">
  <div class="pie-in">
    <span id="pie-autora"></span>
    <span>Java 21 en el servidor · JavaScript sin dependencias en el navegador</span>
  </div>
</footer>
<script src="datos.js"></script>
<script src="js/resaltado.js"></script>
<script src="js/uml.js"></script>
<script src="js/app.js"></script>
</body>
</html>
